[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-systems-bakeoff"
version = "0.2.0"
description = "Reproduce Flybrain · Jev · Laya decision bakeoff on locked public rows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (orchestration); AGPL-3.0-or-later (flybrain package) — see LICENSING.md" }
authors = [{ name = "Decision Science Corp" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
laya = []  # install ConvAI laya separately; version pins change often
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"decision_bakeoff.flybrain" = ["data/*.csv.gz", "data/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
